name: Update ride data

# Rebuilds data/*.json several times a day and publishes it on the `data` branch,
# which is where the site reads its data from. If GitHub Pages is enabled for the
# repository (Settings -> Pages -> Source: GitHub Actions), the site is deployed too.
# Scheduled runs only fire on the repository's default branch.
on:
  schedule:
    - cron: "23 13 * * *"   # about 6 AM Mountain
    - cron: "23 18 * * *"   # about 11 AM Mountain
    - cron: "23 22 * * *"   # about 3 PM Mountain
    - cron: "23 3 * * *"    # about 8 PM Mountain
  workflow_dispatch:
  push:
    paths-ignore: ["README.md"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    # pushes only trigger a rebuild on the default branch
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Start from the data that is live right now, so a source that is down for
      # one run keeps its last good file instead of going blank.
      - name: Restore last published data
        continue-on-error: true
        run: |
          if git fetch --depth 1 origin data 2>/dev/null; then
            for f in club_rides races weather detailed_weather clubs geocache; do
              git show "FETCH_HEAD:$f.json" > "data/$f.json.new" 2>/dev/null \
                && python3 -c "import json,sys; json.load(open(sys.argv[1]))" "data/$f.json.new" \
                && mv "data/$f.json.new" "data/$f.json" || rm -f "data/$f.json.new"
            done
          fi

      - name: Run backend tests
        run: python3 -m unittest discover -s backend/tests

      - name: Build data
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python3 backend/build_data.py

      # One commit, replaced on every run, so the repository does not grow.
      - name: Publish data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf _data && mkdir _data && cp data/*.json _data/
          printf '# Data branch\n\nRebuilt automatically by the "Update ride data" workflow. Do not edit by hand.\n' > _data/README.md
          cd _data
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Ride data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      # ---- GitHub Pages: turned on automatically when the token is allowed to; otherwise
      # skipped quietly until it is enabled under Settings -> Pages -> Source: GitHub Actions ----
      - id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble site
        if: steps.pages.outcome == 'success'
        run: |
          mkdir _site
          cp -r index.html gpx detailed_weather assets data sw.js manifest.json robots.txt LICENSE _site/

      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
